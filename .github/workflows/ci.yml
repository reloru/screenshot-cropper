name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: neither job needs to write anything, just check out the
# repo and run npm/wrangler locally.
permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No runtime dependencies, and the tests import only node builtins plus
      # the app's own modules — so there is nothing to install.
      #
      # Go through npm so this can't drift from what `npm test` runs locally.
      # `node --test test/` (a bare directory) does NOT run the files in it — it
      # tries to LOAD `test/` as a module and dies with MODULE_NOT_FOUND, which
      # exits non-zero for a reason that looks nothing like a failing assertion.
      # This job was red on every run from the repo's first commit onward, so the
      # measurement logic was effectively ungated.
      - name: Measure-logic tests
        run: npm test

  build:
    name: Build check (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Parses wrangler.jsonc and bundles the Worker without uploading, which
      # catches config errors the tests can't see. No credentials needed.
      - run: npx wrangler deploy --dry-run
